[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgepdm"
version = "0.1.0"
description = "Backend-first product data management for FreeCAD teams"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = ["httpx2>=2,<3", "pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
forgepdm = "forgepdm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forgepdm"]

[tool.ruff]
line-length = 100
target-version = "py311"
