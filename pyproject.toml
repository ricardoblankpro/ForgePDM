[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgepdm"
version = "0.1.2"
description = "Backend-first product data management for FreeCAD teams"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
maintainers = [{name = "Ricardo Blank", email = "ricardoblankpro@gmail.com"}]
dependencies = [
    "pillow>=12.1.1,<14",
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = ["httpx2>=2,<3", "pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
forgepdm = "forgepdm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forgepdm"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Explicit baseline shared with addon checks; imports are checked on backend/tooling.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
