name: ForgePDM checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv run --group dev --locked ruff check src tools tests/test_repository_docs.py
      - run: uv run --group dev --locked ruff format --check src tools tests/test_repository_docs.py
      - run: uv run --group dev --locked python tools/check_docs.py
      - run: uv run --group dev --locked pytest tests -q
      - run: node --test tests/web/*.test.mjs
  addon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv run --project clients/freecad --extra dev --locked python clients/freecad/tools/addon.py check
      - run: uv run --project clients/freecad --extra dev --locked pytest clients/freecad/tests -q
      - run: uv run --project clients/freecad --extra dev --locked ruff check clients/freecad
      - run: uv run --project clients/freecad --extra dev --locked ruff format --check clients/freecad
      - run: uv run --project clients/freecad --extra dev --locked python clients/freecad/tools/addon.py build
  qt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1 libopengl0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv run --project clients/freecad --extra dev --locked --with PySide6==6.8.3 python -m pytest clients/freecad/tests/test_bom_dialog.py clients/freecad/tests/test_drawing_bom_ui.py clients/freecad/tests/test_browser_panel.py clients/freecad/tests/test_open_dialog.py clients/freecad/tests/test_localization_ui.py -q
