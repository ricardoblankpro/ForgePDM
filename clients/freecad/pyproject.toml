[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "forgepdm-freecad"
version = "0.2.0"
description = "Thin FreeCAD Workbench for the ForgePDM HTTP API"
requires-python = ">=3.11.0"
dependencies = []
license = "LicenseRef-Proprietary"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "lxml>=5,<7", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["freecad"]

[tool.hatch.build.targets.sdist]
include = ["freecad", "package.xml", "README.md", "LICENSE", "CHANGELOG.md", "Documentation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"freecad/forgepdm/ui.py" = ["F401"]
